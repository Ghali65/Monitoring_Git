

services:
  dagster:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      - DAGSTER_HOME=/opt/dagster/dagster_home

  frontend:
    build:
      context: ./src/monitoring-dashboard
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./src/monitoring-dashboard:/app
      # Permet d'éviter que le dossier node_modules local n'écrase celui du conteneur
      - /app/node_modules
